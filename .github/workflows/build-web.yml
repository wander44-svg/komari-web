name: Build Komari Web 1.4.3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Komari Web 1.4.3
        uses: actions/checkout@v4
        with:
          ref: komari-web-1.4.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: komari-web-1.4.3-dist
          path: dist
